
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Pet 🐾</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap');

:root {
  --ink: #382b42;
  --cream: #fff9ed;
  --pink: #ffb5c8;
  --purple: #c6b4f5;
  --mint: #bdebd6;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 14px;
  background-color: #f9e8dc;
  background-image: radial-gradient(#e7b7bc 1.5px, transparent 1.5px);
  background-size: 20px 20px;
  color: var(--ink);
  font-family: 'Nunito', sans-serif;
}

.game {
  width: 100%;
  max-width: 440px;
  background: var(--cream);
  border: 4px solid var(--ink);
  border-radius: 12px;
  padding: 24px;
  box-shadow: 8px 8px 0 var(--ink);
}

h1, .pixel {
  font-family: 'Press Start 2P', monospace;
}

h1 {
  font-size: 20px;
  line-height: 1.7;
  text-align: center;
  margin: 0;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  margin: 6px 0 22px;
}

.scene {
  position: relative;
  background: #d8d2ff;
  border: 3px solid var(--ink);
  border-radius: 8px;
  min-height: 220px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background-image: radial-gradient(#fff 1px, transparent 1px);
  background-size: 18px 18px;
}

.pet {
  font-size: 92px;
  line-height: 1.4;
  cursor: default;
  user-select: none;
  image-rendering: pixelated;
  filter: drop-shadow(4px 5px 0 #9889bc);
  animation: bounce 1.8s ease-in-out infinite;
}

.pet.playing {
  animation: jump .35s ease-in-out infinite alternate;
}

@keyframes bounce {
  50% { transform: translateY(-8px); }
}

@keyframes jump {
  to { transform: translateY(-20px) rotate(8deg); }
}

.sparkle {
  position: absolute;
  font-size: 22px;
  animation: twinkle 1s ease-in-out infinite alternate;
}

.s1 { top: 22px; left: 35px; }
.s2 { top: 42px; right: 35px; animation-delay: .4s; }
.s3 { bottom: 22px; left: 55px; animation-delay: .7s; }

@keyframes twinkle {
  to { transform: scale(1.3) rotate(15deg); }
}

.pet-name {
  text-align: center;
  font-size: 17px;
  font-weight: 900;
  margin: 16px 0 4px;
}

.mood {
  text-align: center;
  font-size: 13px;
  margin: 0 0 20px;
  min-height: 20px;
}

.stats { display: grid; gap: 14px; }

.stat-header {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 900;
  margin-bottom: 5px;
}

.track {
  height: 15px;
  background: #e9e0e8;
  border: 2px solid var(--ink);
  border-radius: 4px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 75%;
  transition: width .35s ease;
}

.hunger { background: #ffb36c; }
.happy { background: #ff91b3; }
.energy { background: #a5a0ff; }

.buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-top: 23px;
}

button {
  border: 3px solid var(--ink);
  border-radius: 7px;
  padding: 12px 4px;
  font: 900 12px 'Nunito', sans-serif;
  color: var(--ink);
  background: white;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform .1s, box-shadow .1s;
}

button:active {
  transform: translateY(4px);
  box-shadow: none;
}

button:focus-visible {
  outline: 3px dashed var(--ink);
  outline-offset: 4px;
}

.feed { background: #ffe2a8; }
.play { background: #ffc9dc; }
.sleep { background: #d9d2ff; }

.message {
  margin-top: 20px;
  background: #f5eee2;
  border: 2px dashed #b5a3b5;
  padding: 12px;
  border-radius: 6px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.7;
  min-height: 45px;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
}

.footer small {
  font-size: 10px;
  font-weight: 900;
}

.reset {
  padding: 7px 10px;
  font-size: 11px;
  background: white;
}

@media (max-width: 360px) {
  .game { padding: 16px; }
  h1 { font-size: 17px; }
  .pet { font-size: 78px; }
}
</style>
</head>

<body>
<main class="game">
  <h1>PIXEL PET</h1>
  <p class="subtitle">♡ your tiny digital bestie ♡</p>

  <section class="scene" aria-label="Your virtual pet">
    <span class="sparkle s1">✦</span>
    <span class="sparkle s2">♡</span>
    <span class="sparkle s3">✧</span>
    <div class="pet" id="pet" role="img" aria-label="Happy cat">🐱</div>
  </section>

  <div class="pet-name" id="petName">Mochi ✿</div>
  <p class="mood" id="mood" aria-live="polite">feeling purr-fect!</p>

  <section class="stats" aria-label="Pet stats">
    <div>
      <div class="stat-header">
        <span>🍎 Hunger satisfaction</span>
        <span id="hungerNum">75%</span>
      </div>
      <div class="track"><div class="fill hunger" id="hungerBar"></div></div>
    </div>

    <div>
      <div class="stat-header">
        <span>💗 Happiness</span>
        <span id="happyNum">80%</span>
      </div>
      <div class="track"><div class="fill happy" id="happyBar"></div></div>
    </div>

    <div>
      <div class="stat-header">
        <span>⚡ Energy</span>
        <span id="energyNum">70%</span>
      </div>
      <div class="track"><div class="fill energy" id="energyBar"></div></div>
    </div>
  </section>

  <div class="buttons">
    <button class="feed" id="feedBtn">🍎 FEED</button>
    <button class="play" id="playBtn">🎾 PLAY</button>
    <button class="sleep" id="sleepBtn">🌙 SLEEP</button>
  </div>

  <div class="message" id="message" aria-live="polite">
    Hi bestie! Mochi is waiting for you. ♡
  </div>

  <div class="footer">
    <small>CARE POINTS: <span id="points">0</span> ⭐</small>
    <button class="reset" id="resetBtn">↻ RESET</button>
  </div>
</main>

<script>
const initial = { hunger: 75, happy: 80, energy: 70, points: 0 };

let stats = { ...initial };
let sleeping = false;
let sleepTimer = null;
let messageTimer = null;

const $ = id => document.getElementById(id);

function say(text) {
  $("message").textContent = text;
}

function update() {
  $("hungerNum").textContent = stats.hunger + "%";
  $("happyNum").textContent = stats.happy + "%";
  $("energyNum").textContent = stats.energy + "%";
  $("points").textContent = stats.points;

  $("hungerBar").style.width = stats.hunger + "%";
  $("happyBar").style.width = stats.happy + "%";
  $("energyBar").style.width = stats.energy + "%";

  let pet = "🐱";
  let mood = "feeling purr-fect!";

  if (sleeping) {
    pet = "😴";
    mood = "zzz... taking a cat nap";
  } else if (stats.hunger < 25) {
    pet = "🥺";
    mood = "Mochi is hungry!";
  } else if (stats.energy < 20) {
    pet = "😪";
    mood = "Mochi needs a nap!";
  } else if (stats.happy < 25) {
    pet = "🙀";
    mood = "Mochi wants some attention!";
  } else if (stats.happy >= 85 && stats.hunger >= 50) {
    pet = "😻";
    mood = "the happiest kitty ever!";
  }

  $("pet").textContent = pet;
  $("pet").setAttribute("aria-label", mood);
  $("mood").textContent = mood;
}

function clamp(value) {
  return Math.max(0, Math.min(100, value));
}

function act(action) {
  if (sleeping && action !== "sleep") {
    say("Shhh! Mochi is sleeping. Wake them up first. 💤");
    return;
  }

  if (action === "feed") {
    if (stats.hunger === 100) {
      say("Mochi is full! No more snacks right now. 🍎");
      return;
    }
    stats.hunger = clamp(stats.hunger + 25);
    stats.happy = clamp(stats.happy + 5);
    stats.points += 10;
    say("Nom nom nom! Mochi loves snack time. +10 points 🍎");
  }

  if (action === "play") {
    if (stats.energy < 15) {
      say("Mochi is too tired to play. Let them sleep first! 😴");
      return;
    }
    stats.happy = clamp(stats.happy + 20);
    stats.energy = clamp(stats.energy - 15);
    stats.hunger = clamp(stats.hunger - 5);
    stats.points += 15;
    $("pet").classList.add("playing");
    setTimeout(() => $("pet").classList.remove("playing"), 1200);
    say("WHEEE! Mochi had the best playtime ever! +15 points 🎾");
  }

  if (action === "sleep") {
    if (sleeping) {
      clearTimeout(sleepTimer);
      sleeping = false;
      stats.energy = clamp(stats.energy + 25);
      update();
      say("Rise and shine! Mochi is awake and refreshed. ☀️");
      return;
    }
    sleeping = true;
    say("Sweet dreams, Mochi. Click SLEEP again to wake up. 🌙");
    sleepTimer = setTimeout(() => {
      if (!sleeping) return;
      sleeping = false;
      stats.energy = clamp(stats.energy + 35);
      stats.happy = clamp(stats.happy + 5);
      update();
      say("Mochi woke up refreshed! ☀️");
    }, 5000);
  }

  update();
}

$("feedBtn").addEventListener("click", () => act("feed"));
$("playBtn").addEventListener("click", () => act("play"));
$("sleepBtn").addEventListener("click", () => act("sleep"));

$("resetBtn").addEventListener("click", () => {
  clearTimeout(sleepTimer);
  clearTimeout(messageTimer);
  sleeping = false;
  stats = { ...initial };
  update();
  say("A fresh start! Mochi is ready for more adventures. ♡");
});

update();
</script>
</body>
</html>
